[project]
name = "casemap"
version = "0.1.0"
description = "功能测试用例图管理系统 - 从接口列表逆向生成可视化测试用例脑图"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "casemap team", email = "team@casemap.dev" }]
dependencies = [
    "pydantic>=2.6",
    "orjson>=3.9",
    "click>=8.1",
    "jinja2>=3.1",
    "openapi-spec-validator>=0.7",
    "openapi-schema-validator>=0.6",
    "prance>=23.6",
    "openai>=1.30",
]

[project.scripts]
casemap = "casemap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "syrupy>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casemap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"src/casemap/models/**" = ["UP042"]  # str + Enum is the canonical pattern

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=casemap --cov-report=term-missing"
asyncio_mode = "auto"
