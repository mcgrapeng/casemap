name: Python Server E2E

on:
  push:
    branches: [main, master]
    paths:
      - src/casemap/server/**
      - tests/server/**
      - tests/e2e/**
      - frontend/src/**
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/python-server-test.yml
  pull_request:
    branches: [main, master]
    paths:
      - src/casemap/server/**
      - tests/server/**
      - tests/e2e/**
      - frontend/src/**
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/python-server-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Install Playwright Chromium + headless shell
        # tests/e2e/test_full_flow.py uses p.chromium.launch(headless=True),
        # which on Playwright 1.49+ needs the headless shell binary
        # (chromium_headless_shell-*), not the full chromium browser. Install
        # both so the test can find the right binary.
        run: |
          uv run playwright install chromium chromium-headless-shell

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: Mypy
        run: uv run mypy src/casemap

      - name: Start server
        run: |
          nohup uv run casemap serve --port 8765 --db "sqlite:////tmp/test.db" > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Wait for boot
        run: sleep 3

      - name: Run API e2e script (httpx-based; not a pytest module)
        run: uv run python tests/server/test_e2e.py
        env:
          CASEMAP_BASE_URL: http://127.0.0.1:8765

      - name: Run Playwright UI e2e tests
        run: uv run pytest tests/e2e/ -v -m slow
        env:
          PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "===== server.log ====="
          cat /tmp/server.log || true

      - name: Kill server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
          pkill -f "casemap serve" 2>/dev/null || true
