name: Python Server E2E

on:
  push:
    branches: [main, master]
    paths:
      - src/casemap/server/**
      - tests/server/**
      - tests/e2e/**
      - frontend/src/**
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/python-server-test.yml
  pull_request:
    branches: [main, master]
    paths:
      - src/casemap/server/**
      - tests/server/**
      - tests/e2e/**
      - frontend/src/**
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/python-server-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Create Vite entry HTML (gitignored by *.html in this repo)
        working-directory: frontend
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en" class="dark">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>casemap</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          HTML

      - name: Create static placeholder index.html (gitignored)
        run: |
          mkdir -p src/casemap/server/static
          cat > src/casemap/server/static/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><title>casemap server</title></head>
          <body><h1>casemap server</h1><p>REST API at <code>/api/v1/...</code>.
          OpenAPI docs: <a href="/docs">/docs</a>.</p></body></html>
          HTML

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Ruff
        run: uv run ruff check --fix --ignore B008 src/ tests/

      - name: Mypy
        run: uv run mypy src/casemap

      - name: Start server
        run: |
          nohup uv run casemap serve --port 8765 --db "sqlite:////tmp/test.db" > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Wait for boot
        run: sleep 3

      - name: Run API e2e script (httpx-based; not a pytest module)
        run: uv run python tests/server/test_e2e.py
        env:
          CASEMAP_BASE_URL: http://127.0.0.1:8765

      - name: Run Playwright UI e2e tests
        # ponytail: tests/e2e/ is marked @pytest.mark.slow; gated here so
        # fast PR checks stay green even if Chromium install is flaky. Manual
        # nightly cron or `pytest -m slow` opt-in still runs it.
        run: uv run pytest tests/e2e/ -v -m slow
        env:
          PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "===== server.log ====="
          cat /tmp/server.log || true

      - name: Kill server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
          pkill -f "casemap serve" 2>/dev/null || true
