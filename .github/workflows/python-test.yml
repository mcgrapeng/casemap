name: Python Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Create static placeholder index.html
        run: |
          mkdir -p src/casemap/server/static
          cat > src/casemap/server/static/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><title>casemap server</title></head>
          <body><h1>casemap server</h1><p>REST API at <code>/api/v1/...</code>.
          OpenAPI docs: <a href="/docs">/docs</a>.</p></body></html>
          HTML

      - name: Ruff
        run: uv run ruff check --fix --ignore B008 src/ tests/

      - name: Mypy
        run: uv run mypy src/casemap

      - name: Pytest
        run: uv run pytest -q -m "not slow" --cov=casemap --cov-report=xml

      - name: Check Codecov token availability
        id: check-token
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        if: steps.check-token.outputs.has_token == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
